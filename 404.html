<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - الصفحة غير موجودة | Rihan Fashion</title>
  <link rel="icon" type="image/png" href="logo_without_text.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #391925, #5a2d3e);
      padding: 20px;
      text-align: center;
    }
    .error-content { max-width: 450px; }
    .error-code { font-size: 100px; font-weight: 700; color: #c9a87c; line-height: 1; margin-bottom: 10px; font-family: 'Playfair Display', serif; }
    .error-content h1 { font-size: 22px; color: #FFEAD4; margin-bottom: 10px; font-family: 'Kufi', serif; }
    .error-content p { font-size: 14px; color: #ddd; margin-bottom: 25px; font-family: 'Scheherazade New', serif; }
    .error-content .btn-primary { font-family: 'Kufi', serif; }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1>الصفحة غير موجودة</h1>
      <p>عذراً، الصفحة التي تبحثين عنها غير متوفرة. قد تكون تمت إزالتها أو الرابط غير صحيح.</p>
      <a href="index.html" class="btn-primary">العودة إلى الرئيسية</a>
    </div>
  </div>
</body>
</html>
